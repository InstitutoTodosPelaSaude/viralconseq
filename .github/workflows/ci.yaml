name: 'CI'

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install lint tooling
        # black pinned to the 2026 line so formatting is deterministic in CI.
        run: pip install "black>=26,<27" "ruff>=0.5" "mypy>=1.0"
      - name: black --check
        run: black --check viralconseq/ test/
      - name: ruff check
        run: ruff check viralconseq/ test/
      - name: mypy
        # Gating: type regressions block the build.
        run: mypy viralconseq/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        # pulp<2.8: Snakemake 7.32 calls pulp.list_solvers(), removed in pulp 2.8.
        run: |
          pip install -e ".[dev]" "pulp<2.8"
      - name: Verify console script
        run: viralconseq --version
      - name: Unit tests with coverage
        run: pytest test/ -m "not empirical" --ignore=test/dryrun_test.py --cov=viralconseq --cov-report=term-missing
      - name: Snakemake dry-run tests
        run: pytest test/dryrun_test.py -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Sphinx toolchain
        run: pip install -r docs/requirements.in
      - name: Build docs (warnings are errors)
        run: sphinx-build -W -b html docs docs/_build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install scanners
        run: pip install pip-audit bandit
      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          pip install -e .
          pip-audit
      - name: bandit (advisory)
        continue-on-error: true
        run: bandit -r viralconseq -x viralconseq/scripts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build container image (smoke)
        run: docker build -t viralconseq:ci .

  conda-smoke:
    # Full conda-env install smoke test (mirrors real user setup).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add conda to PATH
        run: echo "$CONDA/bin" >> $GITHUB_PATH
      - name: Create conda env
        run: conda env update --file environment.yml --name viralconseq
      - name: Activate env
        run: echo "$CONDA/envs/viralconseq/bin" >> $GITHUB_PATH
      - name: Install with dev extras
        run: pip install -e ".[dev]"
      - name: Verify install
        run: viralconseq --version
      - name: Unit + dry-run tests
        run: |
          python -m unittest discover ./test -p '*test.py'
          pytest test/dryrun_test.py -v

  wheel-smoke:
    # Build the wheel and install it into a clean interpreter, then drive the CLI from
    # outside the checkout so the test exercises the installed package (not the source
    # tree) and proves the wheel ships every workflow, env, template and helper script.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build wheel
        run: pip wheel . --no-deps -w dist/
      - name: Install the wheel
        # pulp<2.8: Snakemake 7.32 calls pulp.list_solvers(), removed in pulp 2.8.
        run: pip install dist/*.whl "pulp<2.8"
      - name: CLI smoke from outside the checkout
        working-directory: /tmp
        run: |
          viralconseq --help
          viralconseq rerun --help
          viralconseq create-report --help
          viralconseq setup --dry-run --skip-viralqc-db --skip-clair3-models
      - name: Installed package ships every workflow asset
        working-directory: /tmp
        run: |
          python - "$GITHUB_WORKSPACE" <<'EOF'
          import importlib.resources
          import importlib.util
          import pathlib
          import sys

          checkout = pathlib.Path(sys.argv[1]).resolve()
          src = checkout / "viralconseq" / "scripts"
          patterns = ("*.smk", "rules/*.smk", "envs/clair3.yaml", "templates/report.html", "python/*.py")
          expected = sorted(
              p.relative_to(src).as_posix() for pat in patterns for p in src.glob(pat)
          )
          assert expected, f"no assets matched under {src}"
          assert any(f.endswith(".smk") for f in expected)
          assert "envs/clair3.yaml" in expected and "templates/report.html" in expected

          spec = importlib.util.find_spec("viralconseq")
          installed = pathlib.Path(spec.origin).resolve().parent
          assert not installed.is_relative_to(checkout), (
              f"viralconseq imported from the checkout ({installed}), not the wheel"
          )

          pkg = importlib.resources.files("viralconseq.scripts")
          missing = [f for f in expected if not pkg.joinpath(f).is_file()]
          assert not missing, "missing from the installed package: " + ", ".join(missing)
          print(f"OK: {len(expected)} assets present in {installed}")
          EOF
