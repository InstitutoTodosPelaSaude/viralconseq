<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viralconseq run report</title>
<link rel="stylesheet" href="report.css">
</head>
<body>

<!-- Every section of the page is a Preact component under report/; app.js lays them out
     here. The text below shows only when the browser cannot run the page. -->
<div id="app"><p class="wrap">This report needs a browser from 2023 or later (Chrome 89, Firefox 108,
  Safari 16.4) with JavaScript enabled.</p></div>

<div id="tip" role="tooltip" aria-hidden="true"></div>

<script id="run-data" type="application/json">/*{{DATA}}*/</script>
<!-- Module names the components import by. build_report.py replaces each path with the
     file's contents (a data: URL), so the page it writes is a single file. -->
<script type="importmap">
{
  "imports": {
    "preact": "./vendor/preact.mjs",
    "preact/hooks": "./vendor/preact-hooks.mjs",
    "htm": "./vendor/htm.mjs",
    "report/core": "./report/core.js",
    "report/ui": "./report/ui.js",
    "report/masthead": "./report/masthead.js",
    "report/kpis": "./report/kpis.js",
    "report/overview": "./report/overview.js",
    "report/table": "./report/table.js",
    "report/detail": "./report/detail.js",
    "report/provenance": "./report/provenance.js",
    "report/app": "./report/app.js"
  }
}
</script>
<script type="module">import "report/app";</script>
</body>
</html>
