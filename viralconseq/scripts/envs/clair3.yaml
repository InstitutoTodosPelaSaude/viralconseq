channels:
  - conda-forge
  - bioconda
dependencies:
  # Clair3 2.x ships PyTorch models (pileup.pt + full_alignment.pt) and needs
  # python 3.11; the models viralconseq uses live outside this env, in the
  # directory `viralconseq setup --clair3-models` fills (see constants.Clair3Models).
  - python>=3.11,<3.12
  - clair3=2.0.2
  - samtools=1.23
  - bcftools=1.23
