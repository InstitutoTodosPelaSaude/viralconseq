[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viralconseq"
dynamic = ["version"]
description = "Reference-guided consensus sequence inference for viral high-throughput sequencing data."
readme = "README.md"
authors = [
    { name = "Filipe Moreira", email = "filiperomero2@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.12"
keywords = [
    "viral genomics",
    "consensus sequence",
    "reference-guided assembly",
    "high-throughput sequencing",
    "amplicon sequencing",
    "bioinformatics",
    "snakemake",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "snakemake>=7.32,<8",
    # Snakemake 7.32 calls pulp.list_solvers(), which was removed in pulp 2.8.
    "pulp<2.8",
]

[project.optional-dependencies]
dev = [
    # which runs inside envs/utils.yaml at pipeline runtime.
    "black>=26,<27",
    "pytest>=9.0",
    "pytest-cov>=5.0",
    "mypy>=1.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/filiperomero2/viralconseq"
Documentation = "https://viralconseq.readthedocs.io/en/latest/"
Changelog = "https://github.com/filiperomero2/viralconseq/blob/main/CHANGELOG.md"
Issues = "https://github.com/filiperomero2/viralconseq/issues"

[project.scripts]
viralconseq = "viralconseq.cli:main"

[tool.setuptools.dynamic]
version = { attr = "viralconseq.__version__" }

[tool.setuptools.packages.find]
include = ["viralconseq*"]
exclude = ["test*", "docs*"]

[tool.setuptools.package-data]
"viralconseq.scripts" = ["*.smk", "**/*.smk", "envs/*.yaml"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Conservative starting set; can expand later.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length is handled by black where it cares; do not double-flag
]

[tool.ruff.lint.per-file-ignores]
# Snakemake injects a `snakemake` global into `script:` files at runtime.
# Ruff cannot see this, so silence F821 for those files.
"viralconseq/scripts/python/*.py" = ["F821"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Snakemake injects a `snakemake` global into `script:` files at runtime.
module = "viralconseq.scripts.python.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["*_test.py"]
python_classes = ["Test_*", "Test*"]
python_functions = ["test_*"]
addopts = "-m 'not empirical'"
markers = [
    "empirical: end-to-end tests that download real data and run full pipelines (slow, opt-in)",
]
